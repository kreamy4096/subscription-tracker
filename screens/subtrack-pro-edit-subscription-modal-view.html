<body class="bg-surface text-on-surface min-h-screen">
<!-- Background Dashboard (Dimmed State) -->
<div class="fixed inset-0 overflow-hidden pointer-events-none opacity-50 grayscale-[0.2]">
<img alt="Dashboard Background" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCK_Z46g5nC19PkPoU-2YT7ZrkLECQyGM34Cvaw7jqiz1xuZtWRJJ6boiOCPls-P2GJZHpXExn-Fyr_owiyNQ3FI5-Nt2BhVDytxSvm90KmtQVLRclEJH0l067oHM2iSJLC6c9pSSez7SmjVgQfQedlYo1TO6Qak5AltQKQRwDpgrcFKAVZ7rxF-OfxbVc2Lzd1L_agpciMFKyYZomPy_VKDiC-AE1_gR1sk8h-nA3dnWxfYfQLwy9XSh5iOV-_SBVAt3AOtiGRoiQ"/>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-margin-mobile md:p-margin-desktop modal-overlay">
<!-- Modal Container -->
<div class="bg-surface-container-lowest w-full max-w-[560px] rounded-xl custom-shadow overflow-hidden flex flex-col animate-in fade-in zoom-in duration-300">
<!-- Modal Header -->
<div class="px-8 py-6 border-b border-surface-container-high flex justify-between items-center">
<h2 class="font-headline-md text-headline-md text-on-surface">Edit Subscription</h2>
<button class="text-secondary hover:text-on-surface transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Modal Content (Scrollable if needed) -->
<form class="p-8 space-y-6">
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<!-- Tool Name -->
<div class="col-span-1 md:col-span-2 space-y-2">
<label class="font-label-md text-label-md text-secondary">Tool</label>
<div class="relative">
<input class="w-full h-11 px-4 rounded-lg border border-outline-variant bg-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md outline-none" type="text" value="Apollo"/>
<span class="absolute right-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline text-[20px]">search</span>
</div>
</div>
<!-- Plan -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-secondary">Plan</label>
<div class="relative">
<select class="w-full h-11 pl-4 pr-10 rounded-lg border border-outline-variant bg-surface appearance-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md outline-none cursor-pointer">
<option>Free</option>
<option selected="">Paid</option>
<option>Enterprise</option>
</select>
<span class="absolute right-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline pointer-events-none">expand_more</span>
</div>
</div>
<!-- Due Date -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-secondary">Due Date</label>
<div class="relative">
<input class="w-full h-11 px-4 rounded-lg border border-outline-variant bg-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md outline-none" type="text" value="15th of month"/>
<span class="absolute right-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline text-[20px]">calendar_today</span>
</div>
</div>
<!-- Price -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-secondary">Price</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-secondary font-body-md">$</span>
<input class="w-full h-11 pl-8 pr-4 rounded-lg border border-outline-variant bg-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md outline-none" type="text" value="99"/>
</div>
</div>
<!-- Login Email -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-secondary">Login Email</label>
<input class="w-full h-11 px-4 rounded-lg border border-outline-variant bg-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md outline-none" type="email" value="admin@apollo.io"/>
</div>
<!-- Action -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-secondary">Action</label>
<div class="relative">
<select class="w-full h-11 pl-4 pr-10 rounded-lg border border-outline-variant bg-surface appearance-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md outline-none cursor-pointer">
<option selected="">Renewal</option>
<option>Cancellation</option>
<option>Upgrade</option>
</select>
<span class="absolute right-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline pointer-events-none">expand_more</span>
</div>
</div>
<!-- Payment Status -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-secondary">Payment Status</label>
<div class="relative">
<select class="w-full h-11 pl-4 pr-10 rounded-lg border border-outline-variant bg-surface appearance-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md outline-none cursor-pointer">
<option>Paid</option>
<option selected="">Not Paid</option>
<option>Pending</option>
</select>
<span class="absolute right-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline pointer-events-none">expand_more</span>
</div>
</div>
</div>
<!-- Helper text -->
<div class="flex items-center gap-2 p-3 bg-surface-container-low rounded-lg">
<span class="material-symbols-outlined text-info text-[18px]">info</span>
<p class="font-label-md text-label-md text-secondary">Changes will reflect in your next monthly analytics report.</p>
</div>
</form>

<div class="px-8 py-6 bg-surface-gray border-t border-surface-container-high flex flex-col sm:flex-row justify-between items-center gap-4">
<button class="flex items-center gap-2 text-error hover:bg-error-container/20 px-4 py-2 rounded-lg transition-colors font-label-md text-label-md">

                        Cancel
                    </button>
<button class="flex-1 sm:flex-none px-6 py-2.5 rounded-lg bg-primary-container text-on-primary font-label-md text-label-md hover:opacity-90 active:scale-95 transition-all shadow-sm">
                        Save Changes
                    </button>
</div>
</div>

<!-- SubTrack Pro Layout Shell (Static/Reference) -->
<div class="fixed top-0 left-0 w-full z-40">
<div class="flex justify-between items-center h-16 px-margin-desktop w-full ml-auto bg-surface-bright border-b border-surface-container-high">
<div class="flex items-center gap-4">
<span class="text-title-lg font-title-lg font-bold text-primary">SubTrack Pro</span>
</div>
</div>
</div>
<script>
        // Simple micro-interaction for primary button
        document.querySelector('.bg-primary-container').addEventListener('click', (e) => {
            const btn = e.currentTarget;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">refresh</span> Saving...';
            setTimeout(() => {
                btn.innerHTML = 'Save Changes';
            }, 1500);
        });

        // Close button functionality simulation
        document.querySelectorAll('button').forEach(btn => {
            if (btn.innerText.includes('Cancel') || btn.querySelector('.material-symbols-outlined')?.innerText === 'close') {
                btn.onclick = () => {
                    document.querySelector('.modal-overlay').classList.add('opacity-0');
                    document.querySelector('.modal-container')?.classList.add('scale-95');
                    setTimeout(() => {
                        alert('Modal closed interaction simulated.');
                        location.reload();
                    }, 300);
                };
            }
        });
    </script>
